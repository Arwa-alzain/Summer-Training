<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Robot Control Panel</title>

<style>
    
.dashboard-btn {
    display: inline-block;
    margin-bottom: 25px;
    padding: 12px 22px;
    background: #222;
    color: white;
    text-decoration: none;
    border-radius: 10px;
    font-size: 15px;
}

.dashboard-btn:hover {
    background: #444;
}

body {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    min-height: 100vh;
    margin: 0;

    background: #fff;

    font-family: Arial, Helvetica, sans-serif;

    gap: 30px;
}


/* =========================
   ROBOT CONTROL
========================= */

.control-section {
    text-align: center;
}

.control-section h1 {
    margin-bottom: 25px;
}


/* Control Pad */

.control-pad {

    display: grid;

    grid-template-columns: repeat(3, 120px);
    grid-template-rows: repeat(3, 70px);

    gap: 20px;

    justify-items: center;
    align-items: center;

    direction: ltr;
}


.btn {

    width: 100%;
    height: 100%;

    border: 2px solid #ccc;

    border-radius: 12px;

    background: #fff;

    font-size: 18px;

    font-weight: bold;

    color: #222;

    cursor: pointer;

    display: flex;

    align-items: center;
    justify-content: center;

    transition: 0.2s ease;
}


.btn:hover {

    background: #f5f5f5;

}


.btn.stop {

    border-color: red;

}


.forward {

    grid-column: 2;
    grid-row: 1;

}


.left {

    grid-column: 1;
    grid-row: 2;

}


.stop {

    grid-column: 2;
    grid-row: 2;

}


.right {

    grid-column: 3;
    grid-row: 2;

}


.backward {

    grid-column: 2;
    grid-row: 3;

}


#status {

    margin-top: 25px;

    font-size: 16px;

    color: #444;

}


/* =========================
   VOICE SECTION
========================= */

.voice-section {

    width: 400px;

    max-width: 90%;

    text-align: center;

    border: 1px solid #ddd;

    border-radius: 15px;

    padding: 25px;

}


.voice-section h2 {

    margin-top: 0;

}


#startVoice {

    padding: 12px 25px;

    border: none;

    border-radius: 10px;

    background: #222;

    color: white;

    font-size: 16px;

    cursor: pointer;

}


#startVoice:hover {

    background: #444;

}


#startVoice.recording {

    background: red;

}


#voiceText {

    width: 100%;

    min-height: 100px;

    margin-top: 20px;

    padding: 10px;

    box-sizing: border-box;

    border: 1px solid #ccc;

    border-radius: 10px;

    font-size: 16px;

    resize: vertical;

}


#saveVoice {

    margin-top: 15px;

    padding: 10px 25px;

    border: none;

    border-radius: 10px;

    background: #222;

    color: white;

    font-size: 15px;

    cursor: pointer;

}


#saveVoice:hover {

    background: #444;

}


#voiceStatus {

    margin-top: 15px;

    font-size: 14px;

    color: #444;

}

</style>

</head>


<body>


<!-- =========================
     ROBOT CONTROL
========================= -->

<div class="control-section">
    
    <h1>Robot Control</h1>

    <a href="dashboard.php" class="dashboard-btn">
    📊 Dashboard
    </a>
    
    
    <div class="control-pad">

        <button
            class="btn forward"
            onclick="sendCommand('forward')">
              forward
        </button>


        <button
            class="btn left"
            onclick="sendCommand('left')">
            left
        </button>


        <button
            class="btn stop"
            onclick="sendCommand('stop')">
            STOP
        </button>


        <button
            class="btn right"
            onclick="sendCommand('right')">
            right
        </button>


        <button
            class="btn backward"
            onclick="sendCommand('backward')">
            backward
        </button>

    </div>


    <div id="status">
        Ready
    </div>

</div>



<!-- =========================
     VOICE TO TEXT
========================= -->

<div class="voice-section">

    <h2>🎤 Speech to Text</h2>


    <button id="startVoice">
        🎤 Start Recording
    </button>


    <textarea
        id="voiceText"
        placeholder="Speak and the text will appear here...."
        readonly>
    </textarea>


    <br>


    <button id="saveVoice">
        Save Text
    </button>


    <div id="voiceStatus">
        Ready to record
    </div>

</div>



<script>


/* =========================
   ROBOT COMMAND
========================= */

function sendCommand(cmd) {

    document.getElementById('status').innerText =
        'Sending...';


    fetch('update_command.php', {

        method: 'POST',

        headers: {
            'Content-Type':
            'application/x-www-form-urlencoded'
        },

        body:
            'command=' +
            encodeURIComponent(cmd)

    })

    .then(res => res.json())

    .then(data => {

        if (data.status === 'success') {

            document.getElementById('status').innerText =
                'The table has been updated:' +
                data.button +
                ' -> "' +
                data.stored_as +
                '"';

        }

        else {

            document.getElementById('status').innerText =
                'Error: ' +
                data.message;

        }

    })

    .catch(err => {

        document.getElementById('status').innerText =
            'Connection to server failed';

    });

}



/* =========================
   SPEECH TO TEXT
========================= */


/*
   Check browser support
*/

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


const startVoiceButton =
    document.getElementById('startVoice');


const voiceText =
    document.getElementById('voiceText');


const voiceStatus =
    document.getElementById('voiceStatus');


let recognition;


if (!SpeechRecognition) {

    startVoiceButton.disabled = true;

    voiceStatus.innerText =
        'Your browser does not support speech to text. Use Google Chrome.';

}

else {

    recognition = new SpeechRecognition();


    /*
       Language
       en-US = English
       ar-SA = Arabic
    */

    recognition.lang = 'en-US';


    recognition.continuous = false;


    recognition.interimResults = false;



    /*
       Start recording
    */

    startVoiceButton.addEventListener(
        'click',
        function () {

            voiceText.value = '';

            voiceStatus.innerText =
                '🎤 Listening now... Speak up';

            startVoiceButton.innerText =
                '🔴 Recording...';


            startVoiceButton.classList.add(
                'recording'
            );


            recognition.start();

        }
    );



    /*
       Speech result
    */

    recognition.onresult = function(event) {

        const text =
            event.results[0][0].transcript;


        voiceText.value = text;


        voiceStatus.innerText =
            'The audio has been converted to text';
    };



    /*
       Recording ended
    */

    recognition.onend = function() {

        startVoiceButton.innerText =
            '🎤 Start Recording';


        startVoiceButton.classList.remove(
            'recording'
        );

    };



    /*
       Error
    */

    recognition.onerror = function(event) {

        voiceStatus.innerText =
            'An error occurred:' +
            event.error;


        startVoiceButton.innerText =
            '🎤 Start Recording';


        startVoiceButton.classList.remove(
            'recording'
        );

    };

}



/* =========================
   SAVE VOICE TEXT
========================= */

document
.getElementById('saveVoice')
.addEventListener(
    'click',
    function() {


        const text =
            voiceText.value.trim();


        if (text === '') {

            voiceStatus.innerText =
                '⚠️ No text to save';

            return;

        }


        voiceStatus.innerText =
               'Text being saved...';



        fetch('save_voice.php', {

            method: 'POST',

            headers: {

                'Content-Type':
                'application/x-www-form-urlencoded'

            },

            body:
                'text=' +
                encodeURIComponent(text)

        })


        .then(res => res.json())


        .then(data => {


            if (data.status === 'success') {

                voiceStatus.innerText =
                    '✅ The text has been saved to the database';

            }

            else {

                voiceStatus.innerText =
                    '❌ Error: ' +
                    data.message;

            }

        })


        .catch(error => {

            voiceStatus.innerText =
                '❌ Server connection failed';
        });

    }
);

</script>


</body>

</html>
